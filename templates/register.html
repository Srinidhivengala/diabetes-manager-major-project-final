{% extends 'base.html' %}
{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h3>Create Account</h3>
      <p>Join us to manage your diabetes health</p>
    </div>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">
            <i class="bi bi-person me-2"></i>First Name
          </label>
          <input class="form-control" type="text" name="first_name" placeholder="Enter your first name" value="{{ request.form.get('first_name', '') }}" required />
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">
            <i class="bi bi-person me-2"></i>Last Name
          </label>
          <input class="form-control" type="text" name="last_name" placeholder="Enter your last name" value="{{ request.form.get('last_name', '') }}" required />
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">
          <i class="bi bi-envelope me-2"></i>Email Address
        </label>
        <input class="form-control" type="email" name="email" placeholder="Enter your email" value="{{ request.form.get('email') or email or '' }}" required />
        <small class="form-text text-muted">
          <i class="bi bi-envelope-check me-1"></i>You will receive a one-time password (OTP) to verify this email.
        </small>
      </div>
      <div class="mb-3">
        <label class="form-label">
          <i class="bi bi-lock me-2"></i>Password
        </label>
        <input class="form-control" type="password" name="password" placeholder="Create a password" required minlength="6" />
        <small class="form-text text-muted">
          <i class="bi bi-info-circle me-1"></i>Password must be at least 6 characters long
        </small>
      </div>
      <div class="mb-4">
        <label class="form-label">
          <i class="bi bi-lock-fill me-2"></i>Confirm Password
        </label>
        <input class="form-control" type="password" name="confirm_password" placeholder="Confirm your password" required minlength="6" />
      </div>
      <button class="btn btn-primary w-100" type="submit">
        <i class="bi bi-person-check me-2"></i>Create Account
      </button>
    </form>
    <div class="auth-link">
      <p class="mb-0">Already have an account? <a href="{{ url_for('login') }}">Sign in here</a></p>
    </div>
  </div>
</div>
{% endblock %}
